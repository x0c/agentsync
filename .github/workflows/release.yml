name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.ref_name }}

  release:
    name: GoReleaser
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare bilingual release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = r"^## " + re.escape(version) + r"\s*\n(.*?)(?=^## |\Z)"
          section = re.search(pattern, changelog, re.MULTILINE | re.DOTALL)
          if section is None:
              raise SystemExit("Missing versioned release notes")
          notes = section.group(1).strip() + "\n"
          headings = ("### English", "### \u7b80\u4f53\u4e2d\u6587")
          if any(heading not in notes for heading in headings) or notes.index(headings[0]) > notes.index(headings[1]):
              raise SystemExit("Release notes must be English first with a complete Chinese section")
          Path(os.environ["RUNNER_TEMP"], "agentsync-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes "${{ runner.temp }}/agentsync-release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
